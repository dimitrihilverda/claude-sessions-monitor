name: Attach the installer package to a release

# The package used to live in the repository, where it could only ever go stale --
# and did: for a while it shipped a sketch from the day before. Building it here
# means the zip attached to a release is made from exactly that tag.
#
# Cutting a release:
#     git tag v1.1.0 && git push origin v1.1.0
# or press "Draft a new release" in the GitHub UI.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: VERSION must match the tag
        # The About box reads VERSION, and the update check compares it to the
        # latest tag. Let those drift and the HUD tells people they are up to date
        # when they are not -- so fail the release instead.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          file="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag  VERSION=$file"
          test "$tag" = "$file"

      - name: Build the package
        run: python build-pakket.py

      - name: Show what is in it
        # A quick look in the log beats discovering afterwards that a shared
        # library was left out and the installed copy is broken.
        run: |
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile('ClaudeDeck.zip')
          namen = z.namelist()
          print("%d files" % len(namen))
          for n in sorted(namen):
              print("  %8d  %s" % (z.getinfo(n).file_size, n))
          nodig = ['sessionlib.ps1', 'focuslib.ps1', 'langlib.ps1', 'beacon.ps1',
                   'hud.ps1', 'hud.vbs', 'install.ps1', 'Install.cmd']
          mist = [n for n in nodig if not any(x.endswith('/' + n) for x in namen)]
          assert not mist, "missing from the package: %s" % mist
          print("all required files present")
          PY

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ClaudeDeck.zip
          fail_on_unmatched_files: true
